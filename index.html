<!DOCTYPE html>

<title>NEON RUSH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020208;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#menu,
#gameOver,
#win{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(2,2,10,.58);
    backdrop-filter:blur(4px);
}

#gameOver,
#win{
    display:none;
}

.logo{
    font-size:clamp(50px,8vw,100px);
    font-weight:900;
    letter-spacing:8px;
    color:white;
    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #00eaff,
        0 0 70px #8b00ff;
}

.subtitle{
    margin:10px 0 40px;
    color:#888;
    letter-spacing:5px;
    font-size:13px;
}

.buttons{
    display:flex;
    gap:15px;
}

button{
    min-width:150px;
    padding:15px 25px;
    border-radius:8px;
    border:2px solid #00eaff;
    background:rgba(0,234,255,.07);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.12s;
}

button:hover{
    transform:scale(1.05);
    background:rgba(0,234,255,.18);
    box-shadow:0 0 25px #00eaff;
}

.easy{
    border-color:#00ff9d;
}

.normal{
    border-color:#00eaff;
}

.hard{
    border-color:#ff2997;
}

.info{
    position:absolute;
    bottom:25px;
    color:#555;
}

#hud{
    position:fixed;
    z-index:10;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:min(750px,80vw);
    display:none;
}

#progressBack{
    width:100%;
    height:8px;
    background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.25);
    border-radius:20px;
    overflow:hidden;
}

#progress{
    width:0%;
    height:100%;
    background:linear-gradient(
        90deg,
        #00eaff,
        #8b00ff,
        #ff2997
    );
}

#score{

    font-weight:bold;
    margin-top:7px;
    font-size:14px;
}

#musicButton{

    right:15px;

    display:none;
    min-width:0;
    padding:9px 13px;

/* =========================================================
   SPAWN
========================================================= */

function spawnPlayer(){

    const first =
        surfaces[0];

    player.x = 180;

    player.y =
        first.y -
        player.size;

    player.vy = 0;

    player.grounded = true;

    player.rotation = 0;

}

========================================================= */

    mode = selectedMode;

    hud.style.display = "block";

    musicButton.style.display = "block";

    cameraX = 0;

    particles.length = 0;

    buildLevel();

    spawnPlayer();

    running = true;

    startMusic();

    lastTime =
        performance.now();

    accumulator = 0;

    requestAnimationFrame(
        gameLoop
    );

}

    if(!running) return;

    if(!player.grounded) return;

    playJumpSound();

}

);

========================================================= */

const FIXED_DT =
    1/60;

let accumulator = 0;

let lastTime =

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(){

    const previousBottom =
        player.y +
        player.size;


    player.vy +=
        GRAVITY;


    player.y +=
        player.vy;


    const currentBottom =
        player.y +
        player.size;


    const worldX =
        cameraX +
        player.x;


    player.grounded = false;


    /*
        COLLISION SOL / PLATEFORME
    */

    for(
        let i=0;
        i<surfaces.length;
        i++
    ){

        const s =
            surfaces[i];


        /*
            Optimisation :
            ignorer les objets très loin.
        */

        if(
            s.x + s.width <
            worldX - 100
        ){
            continue;
        }


        if(
            s.x >
            worldX + player.size + 100
        ){
            continue;
        }


        const horizontal =
            worldX +
            player.size -
            5 >
            s.x
            &&
            worldX + 5 <
            s.x +
            s.width;


        if(!horizontal){
            continue;
        }


        const landing =
            previousBottom <= s.y
            &&
            currentBottom >= s.y
            &&
            player.vy >= 0;


        if(landing){

            player.y =
                s.y -
                player.size;

            player.vy = 0;

            player.grounded = true;

            break;

        }

    }


    /*
        TROU
    */

    if(
        player.y >
        H + 120
    ){

        killPlayer();

        return;

    }


    /*
        ROTATION
    */

    if(
        !player.grounded
    ){

        player.rotation += .18;

    }

}


/* =========================================================
   SPIKE COLLISION
========================================================= */

function checkSpikes(){

    const worldX =
        cameraX +
        player.x;


    const left =
        worldX + 10;

    const right =
        worldX +
        player.size -
        10;

    const top =
        player.y + 9;

    const bottom =
        player.y +
        player.size -
        5;


    for(
        let i=0;
        i<spikes.length;
        i++
    ){

        const s =
            spikes[i];


        /*
            Optimisation
        */

        if(
            s.x + s.width <
            worldX - 50
        ){
            continue;
        }


        if(
            s.x >
            worldX + 100
        ){
            break;
        }


        const spikeLeft =
            s.x + 7;

        const spikeRight =
            s.x +
            s.width - 7;

        const spikeTop =
            s.y -
            s.height;


        if(
            right > spikeLeft
            &&
            left < spikeRight
            &&
            bottom > spikeTop
            &&
            top < s.y
        ){

            killPlayer();

            return;

        }

    }

}


/* =========================================================
   COINS
========================================================= */

function checkCoins(){

    const px =
        cameraX +
        player.x +
        player.size/2;

    const py =
        player.y +
        player.size/2;


    for(
        let i=0;
        i<coins.length;
        i++
    ){

        const c =
            coins[i];


        if(c.collected){
            continue;
        }


        if(
            Math.abs(c.x-px) > 50
        ){
            continue;
        }


        const dx =
            px-c.x;

        const dy =
            py-c.y;


        if(
            Math.sqrt(
                dx*dx +
                dy*dy
            ) < 38
        ){

            c.collected = true;

            createParticles(
                c.x-cameraX,
                c.y,
                8
            );

            playCoinSound();

        }

    }

}

   CAMERA
========================================================= */

    cameraX +=

========================================================= */

function createParticles(
    x,
    y,
    amount
){

    for(

        i<amount;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*6,

            vy:
                (Math.random()-.5)*6,

            life:25

        });

    }

}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += .12;

        p.life--;


        if(p.life <= 0){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   UPDATE
========================================================= */

function updateFixed(){

    if(!running){
        return;
    }


    updateCamera();

    updatePlayer();


    if(!running){
        return;
    }


    checkSpikes();


    if(!running){
        return;
    }


    checkCoins();

    updateParticles();


    const progress =
        Math.min(
            100,
            Math.floor(
                cameraX /
                (levelLength-W)
                * 100
            )
        );


    document.getElementById(
        "progress"
    ).style.width =
        progress+"%";


    document.getElementById(
        "score"
    ).textContent =
        progress+"%";


    if(
        cameraX +
        player.x >=
        levelLength
    ){

        winGame();

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

    if(!running){
        return;
    }


    let delta =
        (now-lastTime)/1000;


    lastTime = now;


    /*
        Empêche un gros freeze
        de casser la physique.
    */

    if(delta > .05){
        delta = .05;
    }


    accumulator +=
        delta;


    while(
        accumulator >=
        FIXED_DT
    ){

        updateFixed();

        accumulator -=
            FIXED_DT;


        if(!running){
            break;
        }

    }


    draw();


    if(running){

        requestAnimationFrame(
            gameLoop
        );

    }

}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(){

    if(!running){
        return;
    }


    running = false;


    createParticles(
        player.x+21,
        player.y+21,
        25
    );


    playDeathSound();

    stopMusic();


    hud.style.display =
        "none";


    setTimeout(
        () => {

            gameOver.style.display =
                "flex";

        },
        180
    );

}


/* =========================================================
   WIN
========================================================= */

function winGame(){

    if(!running){
        return;
    }


    running = false;

    stopMusic();

    playWinSound();


    hud.style.display =
        "none";


    setTimeout(
        () => {

            win.style.display =
                "flex";

        },
        180
    );

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    let hue = 190;


    if(mode === "normal"){
        hue = 250;
    }


    if(mode === "hard"){
        hue = 320;
    }


    /*
        Fond simple.
        Beaucoup moins lourd.
    */

    ctx.fillStyle =
        `hsl(${hue},65%,6%)`;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        GLOW CENTRAL
    */

    const gradient =
        ctx.createRadialGradient(
            W*.5,
            H*.35,
            0,
            W*.5,
            H*.35,
            W*.7
        );


    gradient.addColorStop(
        0,
        `hsla(${hue},100%,40%,.12)`
    );


    gradient.addColorStop(
        1,
        "transparent"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        STARS
    */

    for(
        let i=0;
        i<stars.length;
        i++
    ){

        const s =
            stars[i];


        let x =
            (
                s.x -
                cameraX*s.speed
            ) %
            (W+100);


        if(x<0){
            x += W+100;
        }


        ctx.fillStyle =
            "rgba(255,255,255,.45)";


        ctx.fillRect(
            x,
            s.y,
            s.size,
            s.size
        );

    }


    /*
        GRID
    */

    const grid = 100;

    const offset =
        -(cameraX*.35)%grid;


    ctx.strokeStyle =
        `hsla(${hue},100%,70%,.055)`;


    ctx.lineWidth = 1;


    for(
        let x=offset;
        x<W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }

}


/* =========================================================
   DRAW SURFACES
========================================================= */

function drawSurfaces(){

    /*
        On ne dessine que ce qui
        est proche de l'écran.
    */

    const minX =
        cameraX - 100;

    const maxX =
        cameraX + W + 100;


    for(
        let i=0;
        i<surfaces.length;
        i++
    ){

        const s =
            surfaces[i];


        if(
            s.x+s.width < minX
            ||
            s.x > maxX
        ){

            continue;

        }


        const x =
            s.x-cameraX;


        ctx.fillStyle =
            "#07152c";


        ctx.fillRect(
            x,
            s.y,
            s.width,
            s.height
        );


        /*
            LIGNE NÉON
        */

        ctx.fillStyle =
            "#00eaff";


        ctx.fillRect(
            x,
            s.y,
            s.width,
            4
        );


        /*
            petites lignes
        */

        ctx.fillStyle =
            "rgba(255,255,255,.06)";


        const start =
            Math.max(
                0,
                Math.floor(
                    (cameraX-s.x)/50
                )
            );


        for(
            let j=start;
            j<
            Math.ceil(
                (W+100)/50
            );
            j++
        ){

            const px =
                x+j*50;


            if(
                px > x+s.width
            ){
                break;
            }


            ctx.fillRect(
                px,
                s.y+12,
                1,
                s.height-12
            );

        }

    }

}


/* =========================================================
   DRAW SPIKES
========================================================= */

function drawSpikes(){

    const minX =
        cameraX-100;

    const maxX =
        cameraX+W+100;


    for(
        let i=0;
        i<spikes.length;
        i++
    ){

        const s =
            spikes[i];


        if(
            s.x+s.width < minX
            ||
            s.x > maxX
        ){

            continue;

        }


        const x =
            s.x-cameraX;


        ctx.fillStyle =
            "#ff2997";


        ctx.beginPath();


        ctx.moveTo(
            x,
            s.y
        );


        ctx.lineTo(
            x+s.width/2,
            s.y-s.height
        );


        ctx.lineTo(
            x+s.width,
            s.y
        );


        ctx.closePath();


        ctx.fill();


        ctx.fillStyle =
            "white";


        ctx.fillRect(
            x+s.width/2-1,
            s.y-s.height+5,
            2,
            8
        );

    }

}


/* =========================================================
   DRAW COINS
========================================================= */

function drawCoins(){

    for(
        let i=0;
        i<coins.length;
        i++
    ){

        const c =
            coins[i];


        if(c.collected){
            continue;
        }


        const x =
            c.x-cameraX;


        if(
            x < -30 ||
            x > W+30
        ){
            continue;
        }


        c.phase += .08;


        const r =
            12 +
            Math.sin(c.phase)*2;


        ctx.strokeStyle =
            "#ffe600";


        ctx.lineWidth = 4;


        ctx.beginPath();


        ctx.arc(
            x,
            c.y,
            r,
            0,
            Math.PI*2
        );


        ctx.stroke();

    }

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    /*
        Cube simple et léger.
    */

    ctx.save();


    ctx.translate(
        player.x+21,
        player.y+21
    );


    ctx.rotate(
        player.rotation
    );


    ctx.fillStyle =
        "#00eaff";


    ctx.fillRect(
        -21,
        -21,
        42,
        42
    );


    ctx.fillStyle =
        "#8b00ff";


    ctx.fillRect(
        -15,
        -15,
        30,
        30
    );


    ctx.strokeStyle =
        "white";


    ctx.lineWidth = 2;


    ctx.strokeRect(
        -15,
        -15,
        30,
        30
    );


    ctx.fillStyle =
        "white";


    ctx.fillRect(
        -4,
        -4,
        8,
        8
    );


    ctx.restore();

}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

    for(
        let i=0;
        i<particles.length;
        i++
    ){

        const p =
            particles[i];


        ctx.globalAlpha =
            p.life/25;


        ctx.fillStyle =
            "#00eaff";


        ctx.fillRect(
            p.x,
            p.y,
            4,
            4
        );

    }


    ctx.globalAlpha = 1;

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    drawBackground();

    drawSurfaces();

    drawSpikes();

    drawCoins();

    drawParticles();


    if(running){

        drawPlayer();

    }

}


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

let masterGain = null;

let musicTimer = null;

let musicPlaying = false;

let musicStep = 0;


function initAudio(){

    if(audioContext){
        return;
    }


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        .15;


    masterGain.connect(
        audioContext.destination
    );

}


function playTone(
    frequency,
    duration,
    type,
    volume
){

    if(!audioContext){
        return;
    }


    const osc =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    osc.type =
        type;


    osc.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+
        duration
    );


    osc.connect(gain);

    gain.connect(
        masterGain
    );


    osc.start();


    osc.stop(
        audioContext.currentTime+
        duration
    );

}


function playJumpSound(){

    initAudio();


    playTone(
        500,
        .08,
        "square",
        .08
    );

}


function playCoinSound(){

    initAudio();


    playTone(
        900,
        .08,
        "square",
        .08
    );


    setTimeout(
        () => {

            playTone(
                1300,
                .1,
                "square",
                .06
            );

        },
        50
    );

}


function playDeathSound(){

    initAudio();


    playTone(
        170,
        .25,
        "sawtooth",
        .12
    );


    setTimeout(
        () => {

            playTone(
                70,
                .3,
                "sawtooth",
                .08
            );

        },
        80
    );

}


function playWinSound(){

    initAudio();


    const notes=[
        523,
        659,
        784,
        1046
    ];


    notes.forEach(
        (n,i)=>{

            setTimeout(
                () => {

                    playTone(
                        n,
                        .2,
                        "square",
                        .08
                    );

                },
                i*120
            );

        }
    );

}


/* =========================================================
   MUSIC
========================================================= */

function startMusic(){

    initAudio();


    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    stopMusic();


    musicPlaying = true;

    musicStep = 0;

    musicTick();

}


function stopMusic(){

    musicPlaying = false;


    if(musicTimer){

        clearTimeout(
            musicTimer
        );

        musicTimer = null;

    }

}


function musicTick(){

    if(!musicPlaying){
        return;
    }


    let bpm = 130;


    if(mode === "normal"){
        bpm = 160;
    }


    if(mode === "hard"){
        bpm = 185;
    }


    const beat =
        60000/bpm;


    const melodies = {

        easy:[
            261,
            329,
            392,
            329,
            293,
            349,
            440,
            349
        ],

        normal:[
            220,
            277,
            330,
            415,
            330,
            277,
            247,
            330
        ],

        hard:[
            110,
            165,
            220,
            165,
            123,
            185,
            247,
            185
        ]

    };


    const melody =
        melodies[mode];


    const note =
        melody[
            musicStep%
            melody.length
        ];


    playTone(
        note,
        beat/1000*.65,
        "sawtooth",
        .03
    );


    if(
        musicStep%2===0
    ){

        playTone(
            note/2,
            beat/1000*.5,
            "square",
            .045
        );

    }


    playTone(
        60,
        .055,
        "sine",
        mode==="hard"
            ? .11
            : .065
    );


    musicStep++;


    musicTimer =
        setTimeout(
            musicTick,
            beat
        );

}

easyBtn.onclick =

normalBtn.onclick =

hardBtn.onclick =

retryBtn.onclick =

retryBtn2.onclick =

function returnMenu(){

    running = false;

    stopMusic();


    gameOver.style.display =
        "none";


    win.style.display =
        "none";


    hud.style.display =
        "none";


    musicButton.style.display =
        "none";


    menu.style.display =

    cameraX = 0;


    buildLevel();

    spawnPlayer();

    draw();

}


menuBtn1.onclick =

menuBtn2.onclick =

musicButton.onclick = () => {

        stopMusic();

        musicButton.textContent =
            "🔇 MUSIQUE";

    }

    else{

        startMusic();

        musicButton.textContent =
            "🔊 MUSIQUE";

    }

};

buildEasy();

spawnPlayer();

draw();
